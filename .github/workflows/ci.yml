name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Fully offline: no live web/YouTube/provider calls (CONVENTIONS §15).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (with dev group)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest
