[project]
name = "recipecollater"
version = "0.0.0"
description = "Self-hosted family recipe platform for a home mini PC (LAN-only)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Production dependencies are pinned exactly (CONVENTIONS.md: reproducible installs).
# Heavy ingestion/AI libraries (yt-dlp, Pillow, ingredient-parser, provider SDKs)
# are intentionally NOT here yet — they arrive with the phase that owns them.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "huey==2.5.2",
    "structlog==24.4.0",
    "python-multipart==0.0.20",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "recipe-scrapers==15.11.0",
    "anthropic==0.117.0",
    "yt-dlp==2026.7.4",
    "pillow==12.3.0",
    "openai==2.46.0",
]

[dependency-groups]
# Installed by `uv sync` for development/CI; excluded from production releases
# via `uv sync --no-dev`.
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# A pragmatic-but-strict set: pyflakes, pycodestyle, isort, bugbear, comprehensions,
# pyupgrade, simplify, and security (bandit-lite via flake8-bandit `S`).
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "S", "RUF"]
ignore = [
    "S101", # assert used — allowed in tests (see per-file override below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S104"] # asserts, test secrets, and IP literals are test data

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are the framework idiom, not a B008 bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
# Huey ships without complete type stubs.
module = ["huey.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# yt-dlp ships without type stubs.
module = ["yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Huey's task decorators are untyped; decorating with them is unavoidable here.
module = ["app.tasks", "tests.test_worker"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error"]
